services:
  postgres:
    container_name: training-ia-pg
    image: bitnami/postgresql:latest
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=training-ia
    volumes:
      - postgres_data:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d training-ia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
